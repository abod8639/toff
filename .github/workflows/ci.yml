name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov bsdextrautils

      - name: Check bash syntax
        run: make check

      - name: Run test suite with kcov coverage
        run: |
          mkdir -p coverage
          kcov --include-path=src coverage tests/run_tests.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: abod8639/toff
          directory: ./coverage
          fail_ci_if_error: false
